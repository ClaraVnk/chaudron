<!-- viewBox is trimmed to the ink: the tagline ends near x=850, and the spare
     50 units left over from a round 900 pushed the whole lockup visibly
     off-centre in anything that centres this file.

     The tagline was translated to French without touching this box, and that
     was a constraint rather than luck: measured in the same font at the same
     size, "Jetez-y ce que vous avez, voyez ce qui en sort." renders 577.5 units
     wide -- the width of the English line it replaced, to a tenth of a unit.
     The two-sentence form ("Jetez-y ce que vous avez. Voyez ce qui en sort.")
     is 2 units wider and would have pushed past the box. If this string ever
     changes again, measure before committing: text past x=848 is clipped by
     the viewBox, silently, and only in whatever renders the SVG. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 250" role="img" aria-label="Chaudron">
  <title>Chaudron</title>

  <!--
    Horizontal lockup: mark + wordmark.

    The wordmark is live text, not outlines, so this file renders correctly only
    where one of the listed families is installed. That is deliberate — the text
    stays editable and the file stays small. Anywhere the font cannot be
    guaranteed (README, social card, anything embedded elsewhere), use the
    rendered PNG in this directory instead of this SVG.
  -->

  <defs>
    <linearGradient id="ironL" x1="0.25" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#4A4E57"/>
      <stop offset="0.55" stop-color="#33363D"/>
      <stop offset="1" stop-color="#22242A"/>
    </linearGradient>
    <radialGradient id="brothL" cx="0.5" cy="0.42" r="0.72">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="0.5" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#D9480F"/>
    </radialGradient>
    <linearGradient id="rimGlowL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g transform="translate(8 2)">
    <g fill="none" stroke="#2E3138" stroke-width="14" stroke-linecap="round">
      <path d="M56 112 C 30 120, 30 142, 46 154"/>
      <path d="M200 112 C 226 120, 226 142, 210 154"/>
    </g>
    <g stroke="#22242A" stroke-width="12" stroke-linecap="round">
      <path d="M84 196 L 72 224"/>
      <path d="M172 196 L 184 224"/>
    </g>
    <path d="M40 112 C 40 186, 78 214, 128 214 C 178 214, 216 186, 216 112 Z" fill="url(#ironL)"/>
    <ellipse cx="128" cy="112" rx="88" ry="26" fill="#42464F"/>
    <ellipse cx="128" cy="113" rx="78" ry="21" fill="url(#rimGlowL)"/>
    <ellipse cx="128" cy="114" rx="72" ry="19" fill="url(#brothL)"/>
    <circle cx="103" cy="110" r="7.5" fill="#FFF1CC" opacity="0.92"/>
    <circle cx="146" cy="117" r="5.5" fill="#FFF1CC" opacity="0.78"/>
    <g fill="none" stroke="#F0B93B" stroke-linecap="round">
      <path d="M100 78 C 88 62, 112 54, 100 36" stroke-width="10" opacity="0.5"/>
      <path d="M130 70 C 116 50, 146 40, 132 18" stroke-width="11" opacity="0.72"/>
      <path d="M160 80 C 150 66, 170 58, 160 42" stroke-width="9" opacity="0.42"/>
    </g>
  </g>

  <text x="268" y="132" font-family="URW Gothic, Century Gothic, Questrial, Futura, system-ui, sans-serif"
        font-size="96" font-weight="700" letter-spacing="-1" fill="#22242A">Chaudron</text>
  <text x="272" y="182" font-family="Noto Sans, system-ui, sans-serif"
        font-size="27" fill="#6B7280">Jetez-y ce que vous avez, voyez ce qui en sort.</text>
</svg>
