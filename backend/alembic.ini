# Alembic configuration.
#
# Run from `backend/`:
#   uv run alembic upgrade head
#   uv run alembic downgrade base
#   uv run alembic revision --autogenerate -m "..."
#
# The database URL is deliberately absent: it lives in CHAUDRON_DATABASE_URL and
# is read by `migrations/env.py` through the same Settings object the application
# uses. A URL duplicated here is a URL that eventually disagrees with the one the
# API connects to, and migrations then run against the wrong database.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

# Revision files are named `NNNN_slug.py`: sorted lexically, they are in
# dependency order, which a bare hash never is.
file_template = %%(rev)s_%%(slug)s

# Timestamps in migration files are UTC. A migration written in one timezone and
# read in another otherwise appears to have been applied before its predecessor.
timezone = UTC

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
