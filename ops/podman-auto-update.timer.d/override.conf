# Drop-in overriding the stock podman-auto-update.timer, which fires once a day.
#
# Install to: ~/.config/systemd/user/podman-auto-update.timer.d/override.conf
# Then:       systemctl --user daemon-reload
#             systemctl --user enable --now podman-auto-update.timer
# Verify:     systemctl --user list-timers podman-auto-update.timer
#
# Effect: every container whose quadlet declares `AutoUpdate=registry` is checked
# against its registry every 15 minutes, and restarted when the digest moved.
#
# Cost of this cadence: 96 registry polls per day per image. GHCR tolerates that
# comfortably. What it buys is a worst-case delay of 15 minutes between a merge
# to `main` and it running in production.
#
# What it also buys, and this is the part to think about: there is no human
# between a merged pull request and production. Podman's automatic rollback only
# covers an image that fails its health check. A change that starts fine and is
# simply wrong will ship, and stay.

[Timer]
# Clear the stock daily schedule before setting our own; systemd appends to list
# values rather than replacing them, so omitting these keeps the daily trigger.
OnCalendar=
OnBootSec=
OnUnitActiveSec=

OnBootSec=5min
OnUnitActiveSec=15min
# Spread the load slightly so several hosts do not poll the registry in lockstep.
RandomizedDelaySec=60s
Persistent=true
