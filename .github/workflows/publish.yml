# Publishes the API image to GHCR on every push to `main`.
#
# The production host does not pull from here directly on a schedule of its own
# choosing: `podman-auto-update.timer` polls this registry every 15 minutes and
# restarts the service when the `:latest` digest has moved. See ops/README.md.
#
# Consequence to keep in mind: anything merged to `main` reaches production
# within 15 minutes, with no human gate. The protections are (a) this workflow
# refusing to publish unless CI passed, and (b) Podman rolling the container
# back automatically when the new image fails its health check.
name: publish

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  # Manual re-publish, e.g. to force a rollback to a known-good commit.
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA or tag to build and publish as :latest"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    # Never publish an image whose CI run failed. `workflow_run` fires on
    # completion regardless of outcome, so this guard is load-bearing.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Resolve ref to build
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sha=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.ref.outputs.sha }}

      - name: Log in to GHCR
        run: |
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" \
            | podman login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Build image
        run: |
          SHA="${{ steps.ref.outputs.sha }}"
          podman build \
            --format docker \
            --file backend/Containerfile \
            --tag "${IMAGE}:${SHA::12}" \
            --tag "${IMAGE}:latest" \
            --label "org.opencontainers.image.revision=${SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.licenses=AGPL-3.0-or-later" \
            backend

      - name: Push immutable tag
        run: podman push "${IMAGE}:${{ steps.ref.outputs.sha }}"

      # `:latest` is pushed last and on its own: it is the tag production
      # follows, so it must never move to a digest that was not fully pushed.
      - name: Push rolling tag
        run: podman push "${IMAGE}:latest"

      - name: Report published digest
        run: |
          DIGEST=$(podman image inspect "${IMAGE}:latest" --format '{{ .Digest }}')
          echo "Published ${IMAGE}:latest → ${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo "Immutable tag: ${IMAGE}:${{ steps.ref.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Production will pick this up within 15 minutes." >> "$GITHUB_STEP_SUMMARY"
